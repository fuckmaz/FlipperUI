name: Build release bundles

# This workflow deliberately does not create a tag, draft, or GitHub Release.
# Run it manually, test the resulting workflow artifacts, then create and
# publish the release yourself from GitHub's Releases page. Keep the generated
# AppImage filename unchanged: AppImage catalogs reject names containing Linux.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-bundles-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            label: macOS-AppleSilicon
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
            label: macOS-Intel
          # ubuntu-22.04 keeps the generated packages compatible with older
          # glibc versions. Keep Tauri CLI >=2.11.4: older versions produce a
          # broken absolute .DirIcon symlink that AppImage catalogs reject.
          - platform: ubuntu-22.04
            rust_target: ""
            args: "--bundles deb,appimage"
            label: Linux
          - platform: windows-latest
            rust_target: ""
            args: ""
            label: Windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libudev-dev \
            pkg-config \
            build-essential

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build bundles and upload workflow artifacts
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}
          # Workflow artifacts are independent of GitHub Releases. With no
          # tagName, releaseName, or releaseId, tauri-action cannot create one.
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "[platform]-[arch]-[bundle]"

      - name: Validate AppImage catalog metadata
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: scripts/validate-appimage.sh src-tauri/target/release/bundle/appimage/*.AppImage

name: Repair v0.4.5 AppImage

# Build only the tagged v0.4.5 source, with updated AppImage tooling, on the
# oldest Ubuntu runner we support. This uploads a workflow artifact only; it
# must be checked before replacing the existing GitHub Release asset.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libudev-dev \
            pkg-config \
            build-essential

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: appimage-v0.4.5

      - name: Install npm dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run tauri build -- --bundles appimage

      - name: Validate AppImage catalog metadata
        run: scripts/validate-appimage.sh src-tauri/target/release/bundle/appimage/*.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: FlipperUI-v0.4.5-AppImage-ubuntu-22.04
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
